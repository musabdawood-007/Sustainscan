<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SustainScan Project Poster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#064e3b',
                            light: '#d1fae5',
                            accent: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Glowing Background Animation */
        .bg-glow {
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.15) 0%, rgba(6, 78, 59, 0) 70%);
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen p-6">

    <!-- Poster Container -->
    <div class="relative w-full max-w-4xl aspect-[4/5] md:aspect-[16/9] overflow-hidden rounded-3xl shadow-2xl flex flex-col md:flex-row border border-white/10 bg-gradient-to-br from-gray-900 via-emerald-950 to-black">
        
        <!-- Decorative Background Elements -->
        <div class="absolute top-0 left-0 w-96 h-96 bg-emerald-500 rounded-full mix-blend-screen filter blur-[128px] opacity-20 animate-pulse"></div>
        <div class="absolute bottom-0 right-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-screen filter blur-[96px] opacity-10"></div>

        <!-- Left Side: Typography -->
        <div class="relative z-10 w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center text-center md:text-left">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 w-fit mb-4 md:mx-0 mx-auto">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="text-xs font-bold tracking-widest uppercase text-emerald-300">Live Project</span>
            </div>

            <h1 class="font-display font-black text-5xl md:text-7xl tracking-tighter leading-none mb-4 bg-clip-text text-transparent bg-gradient-to-r from-white via-emerald-100 to-emerald-400 drop-shadow-2xl">
                SUSTAIN<span class="text-emerald-500">SCAN</span>
            </h1>

            <p class="text-gray-300 text-lg md:text-xl font-light mb-8 leading-relaxed max-w-md mx-auto md:mx-0">
                Stop food waste. Save money. <br>
                <span class="text-white font-semibold">The smart auditor for university cafeterias.</span>
            </p>

            <div class="flex flex-wrap justify-center md:justify-start gap-3">
                <span class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm font-semibold backdrop-blur-sm hover:bg-white/10 transition">📊 Analytics</span>
                <span class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm font-semibold backdrop-blur-sm hover:bg-white/10 transition">💸 Loss Tracking</span>
                <span class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm font-semibold backdrop-blur-sm hover:bg-white/10 transition">🌍 Eco-Friendly</span>
            </div>
        </div>

        <!-- Right Side: Visuals & Credits -->
        <div class="relative z-10 w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-between">
            
            <!-- Floating Glass Cards (Visual Impact) -->
            <div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none">
                <div class="w-64 h-64 bg-gradient-to-tr from-emerald-500 to-blue-500 rounded-full blur-[80px]"></div>
            </div>

            <div class="relative space-y-4">
                <!-- Card 1 -->
                <div class="relative group transform transition-all duration-500 hover:-translate-y-2">
                    <div class="absolute inset-0 bg-gradient-to-r from-emerald-500 to-blue-500 rounded-2xl blur opacity-40 group-hover:opacity-60 transition duration-500"></div>
                    <div class="relative bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-5 md:p-6">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 text-xl">
                                <i class="fas fa-chart-pie"></i>
                            </div>
                            <div>
                                <div class="text-gray-400 text-xs uppercase font-bold tracking-wider">Smart Logic</div>
                                <div class="text-white font-bold text-lg">Real-time Reports</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="relative group transform transition-all duration-500 hover:-translate-y-2 delay-75">
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-500 to-purple-500 rounded-2xl blur opacity-40 group-hover:opacity-60 transition duration-500"></div>
                    <div class="relative bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-5 md:p-6">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 text-xl">
                                <i class="fas fa-shield-alt"></i>
                            </div>
                            <div>
                                <div class="text-gray-400 text-xs uppercase font-bold tracking-wider">Security</div>
                                <div class="text-white font-bold text-lg">Admin Protected</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer / Credits -->
            <div class="mt-auto pt-8 border-t border-white/10 text-center md:text-left">
                <div class="text-gray-400 text-sm mb-1">Developed by</div>
                <div class="text-2xl font-bold text-white tracking-wide">
                    Musab <span class="text-emerald-500">Software</span>
                </div>
                <p class="text-xs text-gray-500 mt-2">
                    <i class="fas fa-link text-emerald-600 mr-1"></i> Visit link below for more
                </p>
            </div>
        </div>

    </div>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</body>
</html>
